[platformio]
default_envs = tag

[env]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 460800
lib_deps =
  symlink://../lib/Dw3000

[env:tag]
build_src_filter = +<tag.cpp> -<anchor.cpp>
build_flags = -DTAG_ID=0

[env:tag-usb-log]
build_src_filter = +<tag.cpp> -<anchor.cpp>
build_flags = -DTAG_ID=0 -DUWB_WIFI_TELEMETRY=0

[env:anchor-01]
monitor_speed = 115200
build_src_filter = +<anchor.cpp> -<tag.cpp>
build_flags = -DANCHOR_ID=0xA0

[env:anchor-02]
monitor_speed = 115200
build_src_filter = +<anchor.cpp> -<tag.cpp>
build_flags = -DANCHOR_ID=0xA1

[env:anchor-03]
monitor_speed = 115200
build_src_filter = +<anchor.cpp> -<tag.cpp>
build_flags = -DANCHOR_ID=0xA2

[env:anchor-04]
monitor_speed = 115200
build_src_filter = +<anchor.cpp> -<tag.cpp>
build_flags = -DANCHOR_ID=0xA3

; Experimental single-tag 10 Hz profile. Update master anchor and tag together.
[env:tag-10hz]
extends = env:tag
build_flags = -DTAG_ID=0 -DTDMA_FRAME_MS=100 -DSLOT_DURATION_MS=60

[env:anchor-01-10hz]
extends = env:anchor-01
build_flags = -DANCHOR_ID=0xA0 -DTDMA_FRAME_MS=100 -DSLOT_DURATION_MS=60

[env:tag-10hz-ws]
extends = env:tag-10hz
build_flags = ${env:tag-10hz.build_flags} -DUWB_WS_TELEMETRY=1
lib_deps =
  ${env.lib_deps}
  links2004/WebSockets@2.6.1
